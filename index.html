<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TIKOLAM 永生花藝術商品</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f8f6f3;
      color: #333;
    }

    /* =========================
       首頁黑色標題區
    ========================= */

    header {
      background: #000000;
      color: #ffffff;
      text-align: center;
      padding: 50px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 3px;
      color: #ffffff;
    }

    header p {
      margin-top: 12px;
      margin-bottom: 0;
      font-size: 18px;
      color: #ffffff;
    }

    /* =========================
       Main Content
    ========================= */

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    /* =========================
       AI Chat Button
    ========================= */

    #tikolam-ai-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;

      width: 68px;
      height: 68px;

      border-radius: 50%;
      border: none;

      background: #000000;
      color: white;

      font-size: 28px;

      cursor: pointer;

      box-shadow: 0 5px 20px rgba(0,0,0,0.25);

      z-index: 9999;
    }

    #tikolam-ai-btn:hover {
      transform: scale(1.05);
    }

    /* =========================
       Chat Window
    ========================= */

    #tikolam-chat {
      position: fixed;

      right: 20px;
      bottom: 100px;

      width: 370px;
      height: 560px;

      background: white;

      border-radius: 18px;

      box-shadow: 0 8px 35px rgba(0,0,0,0.25);

      display: none;

      flex-direction: column;

      overflow: hidden;

      z-index: 9999;
    }

    /* =========================
       Chat Header
    ========================= */

    .tik-header {
      background: #000000;
      color: white;

      padding: 16px;
    }

    .tik-header-title {
      font-size: 18px;
      font-weight: bold;
    }

    .tik-status {
      font-size: 12px;
      color: #dddddd;
      margin-top: 5px;
    }

    /* =========================
       Messages
    ========================= */

    #tik-messages {
      flex: 1;

      padding: 15px;

      overflow-y: auto;

      background: #faf8f6;
    }

    .tik-message {
      margin-bottom: 12px;

      max-width: 84%;

      padding: 11px 14px;

      border-radius: 15px;

      line-height: 1.6;

      font-size: 14px;
    }

    .tik-ai-message {
      background: white;

      border: 1px solid #e5e5e5;

      margin-right: auto;
    }

    .tik-user-message {
      background: #000000;

      color: white;

      margin-left: auto;
    }

    /* =========================
       Quick Buttons
    ========================= */

    .tik-quick-buttons {
      padding: 8px 10px;

      background: white;

      border-top: 1px solid #eeeeee;
    }

    .tik-quick-buttons button {
      margin: 3px;

      padding: 7px 10px;

      border-radius: 18px;

      border: 1px solid #cccccc;

      background: white;

      cursor: pointer;

      font-size: 13px;
    }

    .tik-quick-buttons button:hover {
      background: #f2f2f2;
    }

    /* =========================
       Input Area
    ========================= */

    .tik-input-area {
      display: flex;

      padding: 10px;

      border-top: 1px solid #dddddd;

      background: white;
    }

    #tik-input {
      flex: 1;

      padding: 11px 13px;

      border: 1px solid #cccccc;

      border-radius: 20px;

      outline: none;
    }

    #tik-send {
      margin-left: 8px;

      padding: 10px 15px;

      border: none;

      border-radius: 20px;

      background: #000000;

      color: white;

      cursor: pointer;
    }

    #tik-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 38px 15px;
      }

      header h1 {
        font-size: 30px;
      }

      header p {
        font-size: 16px;
      }

      #tikolam-chat {
        width: calc(100% - 20px);

        height: 72vh;

        right: 10px;

        bottom: 92px;
      }

      #tikolam-ai-btn {
        right: 15px;
        bottom: 15px;
      }
    }

  </style>
</head>


<body>


<!-- ==================================== -->
<!-- 黑色品牌區 -->
<!-- ==================================== -->

<header>

  <h1>TIKOLAM</h1>

  <p>
    永生花・藝術花禮・手工藝術商品
  </p>

</header>


<!-- ==================================== -->
<!-- 首頁內容 -->
<!-- ==================================== -->

<main>

  <div class="card">

    <h2>
      為重要的人，挑一份特別的禮物
    </h2>

    <p>
      TIKOLAM 提供永生花、藝術花禮與手工設計商品，
      適合生日、紀念日、情人節、婚禮與各種送禮場合。
    </p>

    <p>
      點擊右下角 💬，AI 客服可以依照送禮對象、
      場合與預算幫您推薦適合的商品。
    </p>

  </div>

</main>


<!-- ==================================== -->
<!-- TIKOLAM AI Chat Widget -->
<!-- ==================================== -->

<button id="tikolam-ai-btn">
  💬
</button>


<div id="tikolam-chat">


  <!-- Chat Header -->

  <div class="tik-header">

    <div class="tik-header-title">
      🌹 TIKOLAM AI 花禮顧問
    </div>

    <div class="tik-status">
      ● AI 客服在線
    </div>

  </div>


  <!-- Messages -->

  <div id="tik-messages">

    <div class="tik-message tik-ai-message">

      您好 👋<br><br>

      我是 <b>TIKOLAM AI 花禮顧問</b>。<br><br>

      我可以協助您挑選：<br><br>

      🌹 永生花<br>
      🎁 永生花禮盒<br>
      💐 藝術花禮<br>
      💍 婚禮／紀念日花禮<br>
      🎨 手工藝術商品<br><br>

      您只要告訴我：<br><br>

      <b>送給誰＋場合＋預算</b><br><br>

      我就可以幫您推薦適合的商品。

    </div>

  </div>


  <!-- 快速選項 -->

  <div class="tik-quick-buttons">

    <button onclick="tikQuick('我要送生日禮物')">
      🎂 生日送禮
    </button>

    <button onclick="tikQuick('我要送女朋友禮物')">
      ❤️ 情人送禮
    </button>

    <button onclick="tikQuick('我要找2000元以下的永生花')">
      💰 2000元以下
    </button>

    <button onclick="tikQuick('介紹熱門永生花商品')">
      🌹 熱門商品
    </button>

  </div>


  <!-- 輸入區 -->

  <div class="tik-input-area">

    <input
      id="tik-input"
      type="text"
      placeholder="例如：送老婆，預算3000元..."
    >

    <button id="tik-send">
      送出
    </button>

  </div>


</div>


<script>

/* ====================================
   Cloudflare Worker URL
==================================== */

const TIKOLAM_AI_API =
  "https://tikolam-ai.hubert893204.workers.dev/";


/* ====================================
   取得 HTML 元件
==================================== */

const tikButton =
document.getElementById("tikolam-ai-btn");

const tikChat =
document.getElementById("tikolam-chat");

const tikInput =
document.getElementById("tik-input");

const tikSend =
document.getElementById("tik-send");

const tikMessages =
document.getElementById("tik-messages");


/* ====================================
   開啟 / 關閉 Chat
==================================== */

tikButton.onclick = function() {

  if (tikChat.style.display === "flex") {

    tikChat.style.display = "none";

  } else {

    tikChat.style.display = "flex";

    tikInput.focus();

  }

};


/* ====================================
   快速問題
==================================== */

function tikQuick(question) {

  tikInput.value = question;

  tikSendMessage();

}


/* ====================================
   加入對話訊息
==================================== */

function tikAddMessage(text, type) {

  const div =
  document.createElement("div");

  div.classList.add("tik-message");

  if (type === "user") {

    div.classList.add("tik-user-message");

  } else {

    div.classList.add("tik-ai-message");

  }

  /*
    AI 回覆使用 textContent，
    避免外部內容直接插入 HTML。
  */

  div.textContent = text;

  tikMessages.appendChild(div);

  tikMessages.scrollTop =
  tikMessages.scrollHeight;

}


/* ====================================
   發送訊息到 Gemini / Cloudflare Worker
==================================== */

async function tikSendMessage() {

  const text =
  tikInput.value.trim();

  if (!text) {
    return;
  }


  /* 顯示客戶訊息 */

  tikAddMessage(text, "user");

  tikInput.value = "";


  /* 暫時避免重複點擊 */

  tikSend.disabled = true;


  /* 顯示讀取中 */

  const loading =
  document.createElement("div");

  loading.className =
  "tik-message tik-ai-message";

  loading.textContent =
  "🌹 TIKOLAM AI 正在幫您挑選...";

  tikMessages.appendChild(loading);

  tikMessages.scrollTop =
  tikMessages.scrollHeight;


  try {

    const response =
      await fetch(
        TIKOLAM_AI_API,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "伺服器沒有回傳正確的 JSON"
      );

    }


    loading.remove();


    /* Worker 或 Gemini 發生錯誤 */

    if (!response.ok) {

      console.error(
        "TIKOLAM AI API Error:",
        data
      );

      tikAddMessage(
        "目前 AI 客服暫時無法回答，請稍後再試。",
        "ai"
      );

      return;
    }


    /* 沒有 reply */

    if (!data.reply) {

      console.error(
        "No reply returned:",
        data
      );

      tikAddMessage(
        "目前沒有收到 AI 的回答，請再試一次。",
        "ai"
      );

      return;
    }


    /* 顯示 Gemini 回答 */

    tikAddMessage(
      data.reply,
      "ai"
    );


  } catch (error) {

    if (loading.isConnected) {
      loading.remove();
    }


    console.error(
      "TIKOLAM AI connection error:",
      error
    );


    tikAddMessage(
      "目前 AI 客服連線失敗，請稍後再試。",
      "ai"
    );

  } finally {

    tikSend.disabled = false;

    tikInput.focus();

  }

}


/* ====================================
   Enter 送出
==================================== */

tikInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !tikSend.disabled
    ) {

      tikSendMessage();

    }

  }
);


/* ====================================
   送出按鈕
==================================== */

tikSend.onclick =
tikSendMessage;

</script>


</body>
</html>
