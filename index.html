<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TIKOLAM 永生花藝術商品</title>


<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;

  font-family:
    Arial,
    "Microsoft JhengHei",
    sans-serif;

  background: #f8f6f3;

  color: #333;
}


/* =====================================
   Header
===================================== */

header {

  background: #000;

  color: white;

  text-align: center;

  padding: 50px 20px;
}


header h1 {

  margin: 0;

  font-size: 38px;

  letter-spacing: 3px;
}


header p {

  margin-top: 12px;

  margin-bottom: 0;

  font-size: 18px;
}


/* =====================================
   Main
===================================== */

main {

  max-width: 900px;

  margin: auto;

  padding: 40px 20px;
}


.card {

  background: white;

  padding: 30px;

  border-radius: 16px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.08);
}


.card h2 {
  margin-top: 0;
}


/* =====================================
   Chat Button
===================================== */

#tikolam-ai-btn {

  position: fixed;

  right: 20px;

  bottom: 20px;

  width: 68px;

  height: 68px;

  border-radius: 50%;

  border: none;

  background: #000;

  color: white;

  font-size: 28px;

  cursor: pointer;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.25);

  z-index: 9999;
}


#tikolam-ai-btn:hover {

  transform: scale(1.05);
}


/* =====================================
   Chat Window
===================================== */

#tikolam-chat {

  position: fixed;

  right: 20px;

  bottom: 100px;

  width: 400px;

  height: 650px;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 8px 35px
    rgba(0,0,0,0.25);

  display: none;

  flex-direction: column;

  overflow: hidden;

  z-index: 9999;
}


/* =====================================
   Chat Header
===================================== */

.tik-header {

  background: #000;

  color: white;

  padding: 16px;
}


.tik-header-title {

  font-size: 18px;

  font-weight: bold;
}


.tik-status {

  margin-top: 5px;

  font-size: 12px;

  color: #ddd;
}


/* =====================================
   Messages
===================================== */

#tik-messages {

  flex: 1;

  padding: 15px;

  overflow-y: auto;

  background: #faf8f6;
}


.tik-message {

  margin-bottom: 12px;

  max-width: 88%;

  padding: 11px 14px;

  border-radius: 15px;

  line-height: 1.6;

  font-size: 14px;

  white-space: pre-wrap;
}


.tik-ai-message {

  background: white;

  border: 1px solid #e5e5e5;

  margin-right: auto;
}


.tik-user-message {

  background: #000;

  color: white;

  margin-left: auto;
}


/* =====================================
   Product Card
===================================== */

.tik-product-card {

  background: white;

  border: 1px solid #ddd;

  border-radius: 15px;

  overflow: hidden;

  margin-bottom: 14px;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,0.07);
}


.tik-product-image {

  width: 100%;

  height: 180px;

  object-fit: cover;

  display: block;

  background: #eee;
}


.tik-product-body {

  padding: 14px;
}


.tik-product-name {

  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;
}


.tik-product-price {

  font-size: 20px;

  font-weight: bold;

  margin-bottom: 10px;
}


.tik-product-detail {

  margin-bottom: 5px;

  font-size: 13px;

  line-height: 1.5;

  color: #555;
}


.tik-product-reason {

  margin-top: 10px;

  padding-top: 10px;

  border-top: 1px solid #eee;

  font-size: 13px;

  line-height: 1.5;
}


.tik-product-link {

  display: block;

  width: 100%;

  margin-top: 12px;

  padding: 10px;

  border-radius: 8px;

  text-align: center;

  text-decoration: none;

  background: #000;

  color: white;

  font-weight: bold;
}


/* =====================================
   Quick buttons
===================================== */

.tik-quick-buttons {

  padding: 8px 10px;

  background: white;

  border-top:
    1px solid #eee;
}


.tik-quick-buttons button {

  margin: 3px;

  padding: 7px 10px;

  border-radius: 18px;

  border:
    1px solid #ccc;

  background: white;

  cursor: pointer;

  font-size: 13px;
}


/* =====================================
   Input
===================================== */

.tik-input-area {

  display: flex;

  padding: 10px;

  border-top:
    1px solid #ddd;

  background: white;
}


#tik-input {

  flex: 1;

  padding: 11px 13px;

  border:
    1px solid #ccc;

  border-radius: 20px;

  outline: none;
}


#tik-send {

  margin-left: 8px;

  padding: 10px 15px;

  border: none;

  border-radius: 20px;

  background: #000;

  color: white;

  cursor: pointer;
}


#tik-send:disabled {

  opacity: 0.5;

  cursor: not-allowed;
}


/* =====================================
   Mobile
===================================== */

@media(max-width:600px) {

  header {

    padding:
      38px 15px;
  }


  header h1 {

    font-size: 30px;
  }


  header p {

    font-size: 16px;
  }


  #tikolam-chat {

    width:
      calc(100% - 20px);

    height: 78vh;

    right: 10px;

    bottom: 92px;
  }


  #tikolam-ai-btn {

    right: 15px;

    bottom: 15px;
  }

}

</style>

</head>


<body>


<header>

<h1>TIKOLAM</h1>

<p>
永生花・藝術花禮・手工藝術商品
</p>

</header>


<main>

<div class="card">

<h2>
為重要的人，挑一份特別的禮物
</h2>

<p>
TIKOLAM 提供永生花、藝術花禮與手工設計商品，
適合生日、紀念日、情人節、婚禮與各種送禮場合。
</p>

<p>
點擊右下角 💬，
告訴 AI 客服送禮對象、場合、預算與喜歡的顏色，
AI 會從 TIKOLAM 商品中為您挑選。
</p>

</div>

</main>


<!-- Chat Button -->

<button id="tikolam-ai-btn">
💬
</button>


<!-- Chat Window -->

<div id="tikolam-chat">


<div class="tik-header">

<div class="tik-header-title">
🌹 TIKOLAM AI 花禮顧問
</div>

<div class="tik-status">
● Gemini AI 客服在線
</div>

</div>


<div id="tik-messages">


<div class="tik-message tik-ai-message">
您好 👋

我是 TIKOLAM AI 花禮顧問。

您可以告訴我：

① 送給誰
② 什麼場合
③ 預算
④ 喜歡什麼顏色

例如：

「送女性朋友生日，預算2000元，喜歡紫色」

我會從目前的 TIKOLAM 商品中幫您挑選。
</div>


</div>


<div class="tik-quick-buttons">

<button
onclick="tikQuick('我要送女性朋友生日禮物，預算2000元，喜歡紫色')">
💜 紫色生日禮
</button>


<button
onclick="tikQuick('我要送女朋友紀念日禮物，預算3000元，喜歡紅色')">
❤️ 紀念日
</button>


<button
onclick="tikQuick('我要找2000元以下的永生花')">
💰 2000元以下
</button>


<button
onclick="tikQuick('推薦目前有庫存的熱門商品')">
🌹 推薦商品
</button>

</div>


<div class="tik-input-area">

<input
id="tik-input"
type="text"
placeholder="例如：送媽媽，預算2500元..."
>

<button id="tik-send">
送出
</button>

</div>


</div>


<script>


// ==========================================
// Worker
// ==========================================

const TIKOLAM_AI_API =
"https://tikolam-ai.hubert893204.workers.dev/";


// ==========================================
// Elements
// ==========================================

const tikButton =
document.getElementById(
  "tikolam-ai-btn"
);

const tikChat =
document.getElementById(
  "tikolam-chat"
);

const tikInput =
document.getElementById(
  "tik-input"
);

const tikSend =
document.getElementById(
  "tik-send"
);

const tikMessages =
document.getElementById(
  "tik-messages"
);


// ==========================================
// Open / Close
// ==========================================

tikButton.onclick =
function() {

  if (
    tikChat.style.display ===
    "flex"
  ) {

    tikChat.style.display =
      "none";

  } else {

    tikChat.style.display =
      "flex";

    tikInput.focus();

  }

};


// ==========================================
// Quick question
// ==========================================

function tikQuick(question) {

  tikInput.value =
    question;

  tikSendMessage();

}


// ==========================================
// Normal message
// ==========================================

function tikAddMessage(
  text,
  type
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "tik-message " +
    (
      type === "user"
      ? "tik-user-message"
      : "tik-ai-message"
    );


  div.textContent =
    text;


  tikMessages.appendChild(
    div
  );


  tikScrollBottom();

}


// ==========================================
// Product Card
// ==========================================

function tikAddProductCard(
  product
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "tik-product-card";


  // -----------------------------
  // Image
  // -----------------------------

  if (product.image) {

    const img =
      document.createElement(
        "img"
      );


    img.className =
      "tik-product-image";


    img.src =
      product.image;


    img.alt =
      product.name || "商品";


    img.onerror =
      function() {

        this.style.display =
          "none";

      };


    card.appendChild(
      img
    );

  }


  // -----------------------------
  // Body
  // -----------------------------

  const body =
    document.createElement(
      "div"
    );


  body.className =
    "tik-product-body";


  // Name

  const name =
    document.createElement(
      "div"
    );


  name.className =
    "tik-product-name";


  name.textContent =
    "🌹 " +
    product.name;


  body.appendChild(
    name
  );


  // Price

  const price =
    document.createElement(
      "div"
    );


  price.className =
    "tik-product-price";


  price.textContent =
    "NT$" +
    Number(
      product.price
    ).toLocaleString();


  body.appendChild(
    price
  );


  // SKU

  tikAddDetail(
    body,
    "商品編號",
    product.sku
  );


  // Color

  tikAddDetail(
    body,
    "顏色",
    tikArrayText(
      product.color
    )
  );


  // Occasion

  tikAddDetail(
    body,
    "適合場合",
    tikArrayText(
      product.occasion
    )
  );


  // Stock

  tikAddDetail(
    body,
    "庫存",
    product.stock + " 件"
  );


  // Reason

  if (
    product.explanation
  ) {

    const reason =
      document.createElement(
        "div"
      );


    reason.className =
      "tik-product-reason";


    reason.textContent =
      "推薦原因：" +
      product.explanation;


    body.appendChild(
      reason
    );

  }


  // Product URL

  if (product.url) {

    const link =
      document.createElement(
        "a"
      );


    link.className =
      "tik-product-link";


    link.href =
      product.url;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.textContent =
      "查看商品";


    body.appendChild(
      link
    );

  }


  card.appendChild(
    body
  );


  tikMessages.appendChild(
    card
  );


  tikScrollBottom();

}


// ==========================================
// Product Detail helper
// ==========================================

function tikAddDetail(
  parent,
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "tik-product-detail";


  div.textContent =
    label +
    "：" +
    value;


  parent.appendChild(
    div
  );

}


// ==========================================
// Array helper
// ==========================================

function tikArrayText(
  value
) {

  if (
    Array.isArray(value)
  ) {

    return value.join("・");

  }


  return value || "";

}


// ==========================================
// Scroll
// ==========================================

function tikScrollBottom() {

  tikMessages.scrollTop =
    tikMessages.scrollHeight;

}


// ==========================================
// Send Message
// ==========================================

async function tikSendMessage() {

  const text =
    tikInput.value.trim();


  if (!text) {
    return;
  }


  tikAddMessage(
    text,
    "user"
  );


  tikInput.value =
    "";


  tikSend.disabled =
    true;


  // Loading

  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "tik-message tik-ai-message";


  loading.textContent =
    "🌹 正在從商品中為您挑選...";


  tikMessages.appendChild(
    loading
  );


  tikScrollBottom();


  try {

    const response =
      await fetch(

        TIKOLAM_AI_API,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              message:
                text

            })

        }

      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      console.error(
        data
      );


      tikAddMessage(
        "目前 AI 客服暫時無法回答，請稍後再試。",
        "ai"
      );


      return;

    }


    // -----------------------------
    // AI Summary
    // -----------------------------

    if (data.message) {

      tikAddMessage(
        data.message,
        "ai"
      );

    }


    // -----------------------------
    // Product cards
    // -----------------------------

    if (
      Array.isArray(
        data.recommendations
      ) &&
      data.recommendations.length > 0
    ) {

      data.recommendations
        .forEach(product => {

          tikAddProductCard(
            product
          );

        });

    } else {

      tikAddMessage(
        "目前沒有找到完全符合條件的商品。",
        "ai"
      );

    }


    // -----------------------------
    // Follow-up
    // -----------------------------

    if (
      data.followUpQuestion
    ) {

      tikAddMessage(
        data.followUpQuestion,
        "ai"
      );

    }


  } catch(error) {


    if (
      loading.isConnected
    ) {

      loading.remove();

    }


    console.error(
      error
    );


    tikAddMessage(
      "AI 客服目前連線失敗，請稍後再試。",
      "ai"
    );


  } finally {

    tikSend.disabled =
      false;


    tikInput.focus();

  }

}


// ==========================================
// Enter
// ==========================================

tikInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
        "Enter" &&
      !tikSend.disabled
    ) {

      tikSendMessage();

    }

  }
);


tikSend.onclick =
  tikSendMessage;


</script>


</body>

</html>
